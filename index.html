<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>記録</title>
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="記録">
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #0a0a0c; }
  iframe { border: 0; width: 100%; height: 100%; display: block; }
  .msg { color: #9aa5a4; font-family: -apple-system, sans-serif; font-size: 14px; padding: 40px 24px; line-height: 1.7; }
</style>
</head>
<body>
<script>
  // アプリ本体のURLは #フラグメントで受け取る(このリポジトリには含めない)
  var target = decodeURIComponent((location.hash || '').slice(1));
  if (target && /^https:\/\/script\.google\.com\//.test(target)) {
    var f = document.createElement('iframe');
    f.src = target;
    f.setAttribute('allow', 'clipboard-write');
    document.body.appendChild(f);
  } else {
    document.body.innerHTML = '<div class="msg">アプリURLが見つかりません。<br>ホーム画面に追加するときは、共有されたURL(#付きの完全版)をそのまま開いてから追加してください。</div>';
  }
</script>
</body>
</html>
