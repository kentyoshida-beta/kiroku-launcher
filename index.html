<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>記録</title>
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="記録">
<style>
  /* GASはiframe入れ子のため中でenv(safe-area-inset-*)が効かない → 外側で時刻表示/ホームバー分を確保 */
  /* height:100%だと全画面表示のiOSで時刻表示の高さ分だけ短くなり下に隙間が出る → 画面四辺に固定 */
  html, body { margin: 0; padding: 0; background: #ffffff; overflow: hidden; overscroll-behavior: none; }
  body { position: fixed; top: 0; right: 0; bottom: 0; left: 0; display: flex; flex-direction: column; }
  .sa-top { height: env(safe-area-inset-top); background: #0f766e; flex: none; }
  .sa-bottom { height: env(safe-area-inset-bottom); background: #ffffff; flex: none; }
  iframe { border: 0; width: 100%; flex: 1; min-height: 0; display: block; }
  @media (prefers-color-scheme: dark) {
    html, body { background: #1a2026; }
    .sa-top { background: #134e4a; }
    .sa-bottom { background: #1a2026; }
  }
  .msg { color: #9aa5a4; font-family: -apple-system, sans-serif; font-size: 14px; padding: 40px 24px; line-height: 1.7; }
</style>
</head>
<body>
<script>
  // アプリ本体のURLは #フラグメントで受け取る(このリポジトリには含めない)
  var target = decodeURIComponent((location.hash || '').slice(1));
  if (target && /^https:\/\/script\.google\.com\//.test(target)) {
    var f = document.createElement('iframe');
    f.src = target;
    f.setAttribute('allow', 'clipboard-write');
    var saTop = document.createElement('div'); saTop.className = 'sa-top';
    var saBottom = document.createElement('div'); saBottom.className = 'sa-bottom';
    document.body.appendChild(saTop);
    document.body.appendChild(f);
    document.body.appendChild(saBottom);
    // 全画面表示のiOSでは表示領域が時刻表示の高さ分だけ短く報告され、下に隙間が出る → 実際の画面の高さに合わせる
    var fit = function () {
      if (!navigator.standalone) return;
      var portrait = window.innerHeight > window.innerWidth;
      var h = portrait ? Math.max(screen.width, screen.height) : Math.min(screen.width, screen.height);
      document.body.style.bottom = 'auto';
      document.body.style.height = h + 'px';
    };
    fit();
    // --- 一時的な診断表示(原因特定後に削除) ---
    document.documentElement.style.background = '#7a1030';
    document.body.style.background = '#7a1030';
    var dbg = document.createElement('div');
    dbg.style.cssText = 'position:fixed;left:4px;bottom:2px;font:10px/1.2 -apple-system,sans-serif;color:#ffd400;z-index:9;pointer-events:none';
    document.documentElement.appendChild(dbg);
    var show = function () {
      var r = function (el) { var b = el.getBoundingClientRect(); return Math.round(b.top) + '-' + Math.round(b.bottom); };
      dbg.textContent = 'ih' + innerHeight + ' sh' + screen.height + ' vv' + Math.round(window.visualViewport ? visualViewport.height : 0) +
        ' sa' + (navigator.standalone ? 1 : 0) + ' body' + r(document.body) + ' top' + r(saTop) + ' ifr' + r(f) + ' bot' + r(saBottom);
    };
    setTimeout(show, 500); setTimeout(show, 2000); window.addEventListener('resize', function () { setTimeout(show, 100); });
    window.addEventListener('resize', fit);
    window.addEventListener('orientationchange', function () { setTimeout(fit, 300); });
  } else {
    document.body.innerHTML = '<div class="msg">アプリURLが見つかりません。<br>ホーム画面に追加するときは、共有されたURL(#付きの完全版)をそのまま開いてから追加してください。</div>';
  }
</script>
</body>
</html>
